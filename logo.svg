<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" role="img" aria-labelledby="title desc">
<title id="title">Devans Co DC monogram</title>
<desc id="desc">Ivory D and gold C interlocked with a gold sweep and small burgundy accent, without any wordmark.</desc>
<defs>
  <linearGradient id="ivory" x1="0" y1="0" x2="0.85" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="0.48" stop-color="#F8F2E7"/>
    <stop offset="1" stop-color="#D8CFC4"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0.8" y2="1">
    <stop offset="0" stop-color="#A46A16"/>
    <stop offset="0.18" stop-color="#FFDF83"/>
    <stop offset="0.36" stop-color="#FFF5C6"/>
    <stop offset="0.59" stop-color="#E6B84C"/>
    <stop offset="0.8" stop-color="#BF801B"/>
    <stop offset="1" stop-color="#F4CE66"/>
  </linearGradient>
  <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#D51D2F"/>
    <stop offset="1" stop-color="#75121F"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#15050D" flood-opacity=".28"/>
  </filter>
</defs>
<g filter="url(#shadow)">
  <!-- Sturdy D, with a real open counter -->
  <path fill="url(#ivory)" fill-rule="evenodd" d="M142 89H336C451 89 526 171 526 294C526 419 451 501 336 501H142L172 472V119L142 89ZM254 163V427H333C404 427 444 379 444 294C444 210 404 163 333 163H254Z"/>
  <!-- Angular burgundy inset -->
  <path fill="url(#wine)" d="M173 136H284L173 245V136Z"/>
  <!-- Brushed metallic C -->
  <path fill="url(#gold)" fill-rule="evenodd" d="M605 211L555 263C529 232 496 216 457 216C376 216 320 276 320 352C320 429 375 487 457 487C496 487 533 471 565 437L612 490C570 541 512 563 450 563C328 563 239 475 239 352C239 229 331 142 450 142C511 142 564 166 605 211Z"/>
  <!-- Gold sweep bridges the letters -->
  <path fill="url(#gold)" d="M72 483C148 380 270 310 414 283C491 268 577 275 657 303C567 292 483 297 410 320C267 363 158 423 72 483Z"/>
  <path fill="#FFF3C3" opacity=".8" d="M90 463C187 370 286 323 418 296C494 280 562 280 633 296C546 288 481 295 412 314C289 349 185 399 90 463Z"/>
</g>
</svg>
